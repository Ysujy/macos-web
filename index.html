<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>macOS Web</title>
<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;cursor:default}

/* ===== BOOT ===== */
#boot{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s ease}
#boot .logo{width:100px;height:120px;opacity:.95;filter:drop-shadow(0 0 40px rgba(255,255,255,.15))}
#boot .bar{width:200px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:50px;overflow:hidden}
#boot .bar-fill{height:100%;width:0;background:#fff;border-radius:2px;transition:width .05s linear}
.boot-gone{opacity:0;pointer-events:none}

/* ===== LOCK ===== */
#lock-screen{position:fixed;inset:0;z-index:99998;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s;backdrop-filter:blur(40px)}
#lock-screen.hidden{opacity:0;pointer-events:none}
.lock-time{font-size:72px;font-weight:200;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.lock-date{font-size:20px;color:rgba(255,255,255,.8);margin-top:5px}
.lock-avatar{width:80px;height:80px;border-radius:50%;margin-top:60px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 4px 30px rgba(0,0,0,.3)}
.lock-name{color:#fff;font-size:16px;margin-top:12px;font-weight:500}
.lock-pwd{margin-top:16px;padding:8px 16px 8px 36px;width:220px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;backdrop-filter:blur(10px)}
.lock-pwd::placeholder{color:rgba(255,255,255,.4)}
.lock-pwd:focus{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.lock-btn{margin-top:12px;padding:6px 24px;border:none;border-radius:8px;background:#007aff;color:#fff;font-size:14px;cursor:pointer}
.lock-btn:hover{opacity:.85}
.lock-hint{color:rgba(255,255,255,.4);font-size:12px;margin-top:10px}

/* ===== DESKTOP ===== */
#desktop{position:fixed;inset:0;background:linear-gradient(135deg,#4ba3e3,#5b8dd6 20%,#6f6dcc 40%,#6c5ce7 60%,#8e44ad 80%,#9b59b6);overflow:hidden}
#desktop::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.12),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(0,0,0,.1),transparent 50%)}

/* ===== MENU BAR ===== */
#menubar{position:fixed;top:0;left:0;right:0;height:28px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);display:flex;align-items:center;padding:0 12px;z-index:9000;font-size:13px;color:#fff;border-bottom:.5px solid rgba(255,255,255,.1)}
.menubar-item{padding:0 10px;height:100%;display:flex;align-items:center;cursor:pointer;border-radius:4px;white-space:nowrap;position:relative}
.menubar-item:hover{background:rgba(255,255,255,.2)}
.menubar-item.active{background:rgba(255,255,255,.25)}
.menubar-item.bold{font-weight:600}
.menubar-item .apple-logo{width:14px;height:17px;fill:#fff}
.menubar-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.menubar-right .item{padding:0 8px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.menubar-right .item:hover{background:rgba(255,255,255,.2)}

/* Dropdown */
.dropdown{position:absolute;top:100%;left:0;min-width:200px;background:rgba(245,245,245,.95);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:4px 0;box-shadow:0 5px 20px rgba(0,0,0,.15);z-index:10000;display:none;font-size:13px;color:#333}
.dropdown.show{display:block}
.dropdown-item{padding:5px 14px;cursor:pointer;white-space:nowrap;display:flex;justify-content:space-between;align-items:center;border-radius:4px;margin:0 4px}
.dropdown-item:hover{background:#007aff;color:#fff}
.dropdown-item .shortcut{color:#999;font-size:12px}
.dropdown-item:hover .shortcut{color:rgba(255,255,255,.7)}
.dropdown-divider{height:1px;background:rgba(0,0,0,.08);margin:4px 8px}

/* ===== DOCK ===== */
#dock-container{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:8000}
#dock{display:flex;align-items:flex-end;gap:6px;padding:6px 8px;background:rgba(255,255,255,.25);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.2);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.15)}
.dock-item{width:52px;height:52px;cursor:pointer;position:relative;transition:transform .15s cubic-bezier(.25,.46,.45,.94);display:flex;align-items:center;justify-content:center}
.dock-item .dock-icon{width:48px;height:48px;border-radius:12px;pointer-events:none;transition:transform .15s cubic-bezier(.25,.46,.45,.94);display:flex;align-items:center;justify-content:center;font-size:30px}
.dock-item:hover{transform:translateY(-12px) scale(1.15);z-index:10}
.dock-item:hover+.dock-item{transform:scale(1.05)}
.dock-item .tooltip{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.dock-item:hover .tooltip{opacity:1}
.dock-item .running-dot{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.5);opacity:0}
.dock-item.running .running-dot{opacity:1}
.dock-divider{width:1px;height:40px;background:rgba(255,255,255,.2);margin:0 4px;align-self:center}

/* ===== WINDOWS ===== */
.window{position:absolute;min-width:300px;min-height:200px;background:rgba(246,246,246,.95);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 15px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;animation:windowOpen .25s cubic-bezier(.25,.46,.45,.94)}
@keyframes windowOpen{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.window.closing{animation:windowClose .2s ease forwards}
@keyframes windowClose{to{transform:scale(.9);opacity:0}}
.window.minimizing{animation:windowMinimize .3s ease forwards}
@keyframes windowMinimize{to{transform:scale(.3) translateY(200px);opacity:0}}
.window-titlebar{height:38px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.06);background:rgba(245,245,245,.8);flex-shrink:0}
.window-dark .window-titlebar{background:rgba(40,40,40,.8);border-bottom-color:rgba(255,255,255,.08)}
.traffic-lights{display:flex;gap:8px}
.tlight{width:12px;height:12px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.tlight.close{background:#ff5f57;border:.5px solid #e0443e}
.tlight.minimize{background:#ffbd2e;border:.5px solid #dca123}
.tlight.maximize{background:#28c940;border:.5px solid #1aab29}
.tlight svg{width:8px;height:8px;opacity:0;transition:opacity .1s}
.traffic-lights:hover .tlight svg{opacity:1}
.window-title{flex:1;text-align:center;font-size:13px;color:#555;font-weight:500;margin-right:54px}
.window-dark .window-title{color:#aaa}
.window-content{flex:1;overflow:auto;position:relative}

/* ===== FINDER ===== */
.finder{display:flex;height:100%}
.finder-sidebar{width:180px;background:rgba(240,240,240,.6);padding:10px 0;flex-shrink:0;border-right:1px solid rgba(0,0,0,.06);font-size:13px;overflow-y:auto}
.finder-sidebar .section{padding:8px 14px 4px;font-size:11px;color:#888;font-weight:600;text-transform:uppercase}
.finder-sidebar .item{padding:5px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:6px;margin:0 4px}
.finder-sidebar .item:hover{background:rgba(0,0,0,.04)}
.finder-sidebar .item.active{background:#007aff;color:#fff}
.finder-main{flex:1;padding:16px;overflow-y:auto}
.finder-main h3{font-size:20px;font-weight:600;margin-bottom:16px;color:#333}
.finder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px}
.finder-file{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:8px;transition:background .15s}
.finder-file:hover{background:rgba(0,122,255,.08)}
.finder-file .icon{font-size:40px}
.finder-file .name{font-size:12px;text-align:center;word-break:break-word;color:#333}

/* ===== TEXTEDIT ===== */
.textedit{display:flex;flex-direction:column;height:100%}
.textedit-toolbar{padding:6px 12px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;gap:8px;align-items:center;font-size:13px}
.textedit textarea{flex:1;border:none;outline:none;padding:16px;font-size:14px;resize:none;font-family:inherit;background:#fff;line-height:1.5}

/* ===== CALCULATOR ===== */
.calc{display:flex;flex-direction:column;height:100%;background:#f0f0f0}
.calc-display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px 20px;min-height:120px}
.calc-display .value{font-size:48px;font-weight:300;color:#000}
.calc-display .preview{font-size:14px;color:#888;margin-bottom:4px}
.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.calc-btn{padding:18px;font-size:20px;border:none;background:#e0e0e0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;font-weight:400}
.calc-btn:hover{background:#d0d0d0}
.calc-btn:active{background:#b0b0b0}
.calc-btn.op{background:#f5a623;color:#fff}
.calc-btn.op:hover{background:#e8971f}
.calc-btn.op:active{background:#d08715}
.calc-btn.fn{background:#d5d5d5}
.calc-btn.zero{grid-column:span 2}

/* ===== SAFARI ===== */
.safari{display:flex;flex-direction:column;height:100%;background:#fff}
.safari-toolbar{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:8px;background:rgba(250,250,250,.8);flex-shrink:0}
.safari-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.safari-btn:hover{background:rgba(0,0,0,.06)}
.safari-url{flex:1;padding:6px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.6);font-size:13px;outline:none}
.safari-content{flex:1;padding:24px;overflow-y:auto;background:#fff}
.safari-content h1{font-size:28px;margin-bottom:12px}
.safari-content p{margin-bottom:12px;line-height:1.6;color:#333}
.safari-start{text-align:center;padding:40px 20px}
.safari-favorites{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:40px}
.safari-fav{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:12px;border-radius:12px;transition:background .15s}
.safari-fav:hover{background:rgba(0,122,255,.06)}
.safari-fav .icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
.safari-fav .name{font-size:12px;color:#333}

/* ===== TERMINAL ===== */
.terminal{background:#1a1a1a;color:#e0e0e0;font-family:"SF Mono","Menlo","Monaco",monospace;font-size:13px;padding:12px;height:100%;overflow-y:auto}
.terminal .line{margin-bottom:1px;white-space:pre-wrap;word-break:break-word}
.terminal .prompt{color:#4cbb42}
.terminal .path{color:#5dade2}
.terminal .cmd-text{color:#e0e0e0}
.terminal-input-line{display:flex;align-items:center}
.terminal-input{background:transparent;border:none;outline:none;color:#e0e0e0;font-family:inherit;font-size:inherit;flex:1}
.terminal .output{color:#aaa}

/* ===== SYSPREFS ===== */
.sysprefs{display:flex;height:100%}
.sysprefs-sidebar{width:200px;background:rgba(240,240,240,.6);padding:12px 8px;overflow-y:auto;border-right:1px solid rgba(0,0,0,.06)}
.sysprefs-sidebar .item{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sysprefs-sidebar .item:hover{background:rgba(0,0,0,.04)}
.sysprefs-sidebar .item.active{background:#007aff;color:#fff}
.sysprefs-main{flex:1;padding:24px;overflow-y:auto}
.sysprefs-main h2{font-size:18px;margin-bottom:20px}

/* ===== CALENDAR ===== */
.calendar{display:flex;flex-direction:column;height:100%}
.calendar-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.06)}
.calendar-header .month{font-size:18px;font-weight:600}
.calendar-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr)}
.calendar-day-header{text-align:center;padding:8px 4px;font-size:11px;color:#888;font-weight:600;border-bottom:1px solid rgba(0,0,0,.06)}
.calendar-day{border:.5px solid rgba(0,0,0,.04);padding:6px;font-size:12px;cursor:pointer;transition:background .1s;min-height:40px}
.calendar-day:hover{background:rgba(0,122,255,.05)}
.calendar-day.other-month{color:#ccc}
.calendar-day.today{background:#007aff;color:#fff;border-radius:4px}
.calendar-day .num{font-weight:500}

/* ===== NOTES ===== */
.notes{display:flex;height:100%}
.notes-sidebar{width:200px;background:rgba(250,250,250,.8);border-right:1px solid rgba(0,0,0,.06);overflow-y:auto}
.notes-sidebar .note-item{padding:10px 14px;border-bottom:.5px solid rgba(0,0,0,.04);cursor:pointer;font-size:13px}
.notes-sidebar .note-item:hover{background:rgba(0,122,255,.05)}
.notes-sidebar .note-item.active{background:#ffe8b3}
.notes-sidebar .note-item .title{font-weight:500;color:#333;margin-bottom:2px}
.notes-sidebar .note-item .preview{color:#888;font-size:11px}
.notes-editor{flex:1;padding:20px}
.notes-editor textarea{width:100%;height:100%;border:none;outline:none;font-size:14px;resize:none;font-family:inherit;line-height:1.6}

/* ===== MUSIC ===== */
.music{display:flex;flex-direction:column;height:100%;background:#1a1a1a;color:#fff}
.music-header{padding:14px 20px;font-size:16px;font-weight:600;border-bottom:.5px solid rgba(255,255,255,.08)}
.music-art{padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.music-art .cover{width:180px;height:180px;border-radius:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.music-art .title{font-size:18px;font-weight:600}
.music-art .artist{font-size:14px;color:#aaa}
.music-list{flex:1;overflow-y:auto;padding:0 20px 20px}
.music-track{display:flex;align-items:center;padding:8px 12px;border-radius:6px;cursor:pointer;gap:12px;font-size:13px}
.music-track:hover{background:rgba(255,255,255,.06)}
.music-track.playing{background:rgba(255,255,255,.1)}
.music-track .num{width:20px;color:#666;text-align:center}
.music-track .name{flex:1}
.music-track .duration{color:#666;font-size:12px}
.music-controls{padding:12px 20px;border-top:.5px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;gap:24px}
.music-controls .ctrl{font-size:20px;cursor:pointer;opacity:.8;transition:opacity .1s}
.music-controls .ctrl:hover{opacity:1}
.music-controls .play-btn{font-size:28px}

/* ===== PHOTOBOOTH ===== */
.photobooth{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#1a1a1a;gap:20px}
.photobooth .preview-box{width:400px;height:300px;border-radius:12px;background:linear-gradient(135deg,#2a2a2e,#1c1c1e);display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;overflow:hidden}
.photobooth .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.photobooth .flash.flashing{animation:flash .3s ease}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.photobooth button{padding:10px 28px;border-radius:8px;border:none;background:#ff3b30;color:#fff;font-size:16px;cursor:pointer}

/* ===== APPSTORE ===== */
.appstore{display:flex;flex-direction:column;height:100%}
.appstore-header{padding:12px 20px;font-size:18px;font-weight:600;border-bottom:1px solid rgba(0,0,0,.06)}
.appstore-grid{flex:1;overflow-y:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.appstore-card{border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center}
.appstore-card .icon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;flex-shrink:0}
.appstore-card .info{flex:1}
.appstore-card .info .name{font-size:14px;font-weight:600;margin-bottom:2px}
.appstore-card .info .desc{font-size:12px;color:#888}
.appstore-card .get-btn{padding:4px 14px;border-radius:12px;border:none;background:#007aff;color:#fff;font-size:12px;cursor:pointer;font-weight:600}

/* ===== MAPS ===== */
.maps{display:flex;flex-direction:column;height:100%}
.maps-canvas{flex:1;background:linear-gradient(135deg,#2d5a3d,#3a6b4a 30%,#4a7a5a 60%,#2d5a3d);position:relative;overflow:hidden}
.maps-canvas .road{position:absolute;background:rgba(255,255,255,.3)}
.maps-canvas .road.h{height:3px;width:100%;left:0}
.maps-canvas .road.v{width:3px;height:100%;top:0}

/* ===== MAIL ===== */
.mail-sidebar{width:250px;background:rgba(245,245,245,.6);border-right:1px solid rgba(0,0,0,.06);overflow-y:auto;flex-shrink:0}
.mail-main{flex:1;overflow-y:auto;padding:20px}
.mail-item{border-bottom:1px solid rgba(0,0,0,.06);padding:12px 0;cursor:pointer}
.mail-item:hover{background:rgba(0,122,255,.03)}
.mail-item.active{background:rgba(0,122,255,.06)}

/* ===== CONTEXT MENU ===== */
.context-menu{position:fixed;min-width:180px;background:rgba(245,245,245,.95);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:4px 0;box-shadow:0 5px 20px rgba(0,0,0,.15);z-index:10000;font-size:13px}
.context-menu .cm-item{padding:5px 14px;cursor:pointer;border-radius:4px;margin:0 4px}
.context-menu .cm-item:hover{background:#007aff;color:#fff}
.context-menu .cm-divider{height:1px;background:rgba(0,0,0,.08);margin:4px 8px}

/* ===== NOTIFICATION ===== */
.notification{position:fixed;top:40px;right:12px;width:340px;padding:14px 16px;background:rgba(245,245,245,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:9500;display:flex;gap:12px;align-items:flex-start;animation:notifIn .3s ease;font-size:13px}
@keyframes notifIn{from{transform:translateX(380px);opacity:0}}
.notification.out{animation:notifOut .3s ease forwards}
@keyframes notifOut{to{transform:translateX(380px);opacity:0}}
.notification .notif-icon{font-size:24px;flex-shrink:0}
.notification .notif-body{flex:1}
.notification .notif-title{font-weight:600;margin-bottom:2px}
.notification .notif-msg{color:#555}

/* ===== SPOTLIGHT ===== */
#spotlight{position:fixed;top:25%;left:50%;transform:translateX(-50%);z-index:9500;display:none}
#spotlight.show{display:block}
.spotlight-box{width:600px;background:rgba(245,245,245,.95);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:.5px solid rgba(255,255,255,.3);overflow:hidden}
.spotlight-input{width:100%;padding:14px 20px;border:none;outline:none;font-size:22px;background:transparent;color:#333}
.spotlight-results{max-height:300px;overflow-y:auto}
.spotlight-result{padding:8px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px}
.spotlight-result:hover,.spotlight-result.selected{background:#007aff;color:#fff}
.spotlight-result .icon{font-size:20px}
.spotlight-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:9400}

/* ===== RESIZE ===== */
.resize-handle{position:absolute;z-index:50}
.resize-handle.bottom-right{bottom:0;right:0;width:15px;height:15px;cursor:se-resize}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== ABOUT ===== */

<script>
(function(){
'use strict';

// State
var windows={}, zIndex=100, activeWindow=null, activeApp='Finder', windowIdCounter=0;

// Boot
(function(){
  var bar=document.getElementById('bootBar'),pct=0;
  var iv=setInterval(function(){pct+=3+Math.random()*7;if(pct>=100){pct=100;clearInterval(iv)}bar.style.width=pct+'%'},80);
  setTimeout(function(){var b=document.getElementById('boot');b.classList.add('boot-gone');setTimeout(function(){b.style.display='none'},800)},2800);
})();

// Lock screen
function updateLockTime(){
  var d=new Date(),h=d.getHours(),min=d.getMinutes();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('lockTime').textContent=(h<10?'0'+h:h)+':'+(min<10?'0'+min:min);
  document.getElementById('lockDate').textContent=days[d.getDay()]+', '+months[d.getMonth()]+' '+d.getDate();
}
updateLockTime();setInterval(updateLockTime,1000);

function unlock(){
  document.getElementById('lock-screen').classList.add('hidden');
  setTimeout(function(){document.getElementById('lock-screen').style.display='none'},600);
  setTimeout(function(){showNotification('Welcome to macOS','Click dock icons to open apps. Press Cmd+Space for Spotlight.')},1200);
}
document.getElementById('lockPwd').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
document.getElementById('lockBtn').addEventListener('click',unlock);

// Menu bar date
function updateMenuBarDate(){
  var d=new Date(),h=d.getHours(),min=d.getMinutes();
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dateItem').textContent=days[d.getDay()]+' '+months[d.getMonth()]+' '+d.getDate()+' '+(h<10?'0'+h:h)+':'+(min<10?'0'+min:min);
}
updateMenuBarDate();setInterval(updateMenuBarDate,1000);

// Notifications
function showNotification(title,msg){
  var n=document.createElement('div');n.className='notification';
  n.innerHTML='<div class="notif-icon">🔔</div><div class="notif-body"><div class="notif-title">'+title+'</div><div class="notif-msg">'+msg+'</div></div>';
  document.body.appendChild(n);
  setTimeout(function(){n.classList.add('out');setTimeout(function(){n.remove()},300)},4000);
}

// Window management
function createWindow(opts){
  var id='win-'+(++windowIdCounter);
  var win=document.createElement('div');win.className='window';win.id=id;
  var titlebar=document.createElement('div');titlebar.className='window-titlebar';
  var lights=document.createElement('div');lights.className='traffic-lights';
  lights.innerHTML='<div class="tlight close"><svg viewBox="0 0 10 10"><path d="M2,2 L8,8 M8,2 L2,8" stroke="#4d0000" stroke-width="1.2" fill="none"/></svg></div><div class="tlight minimize"><svg viewBox="0 0 10 10"><path d="M2,5 L8,5" stroke="#4d3e00" stroke-width="1.2" fill="none"/></svg></div><div class="tlight maximize"><svg viewBox="0 0 10 10"><path d="M3,3 L7,7 M3,7 L7,3" stroke="#003d00" stroke-width="1.2" fill="none"/></svg></div>';
  var title=document.createElement('div');title.className='window-title';title.textContent=opts.title||'Window';
  titlebar.appendChild(lights);titlebar.appendChild(title);
  var content=document.createElement('div');content.className='window-content';
  if(opts.content)content.innerHTML=opts.content;
  if(opts.dark)win.classList.add('window-dark');
  win.appendChild(titlebar);win.appendChild(content);
  var x=opts.x||120+(windowIdCounter*30)%200,y=opts.y||50+(windowIdCounter*25)%150;
  win.style.left=x+'px';win.style.top=y+'px';win.style.width=(opts.width||600)+'px';win.style.height=(opts.height||420)+'px';win.style.zIndex=++zIndex;
  document.getElementById('desktop').appendChild(win);
  windows[id]={el:win,app:opts.app,title:opts.title,content:content};
  activeWindow=id;activeApp=opts.app||'Finder';
  document.getElementById('activeAppName').textContent=activeApp;
  lights.querySelectorAll('.tlight').forEach(function(l){
    l.addEventListener('mousedown',function(e){e.stopPropagation()});
    l.addEventListener('click',function(e){e.stopPropagation();var a=this.getAttribute('data-action');if(a==='close')closeWindow(id);else if(a==='minimize')minimizeWindow(id);else if(a==='maximize')toggleMaximize(id)});
  });
  makeDraggable(win,titlebar);
  win.addEventListener('mousedown',function(){focusWindow(id)});
  var rh=document.createElement('div');rh.className='resize-handle bottom-right';win.appendChild(rh);makeResizable(win,rh);
  return{id:id,el:win,content:content};
}

function focusWindow(id){
  if(!windows[id])return;
  windows[id].el.style.zIndex=++zIndex;activeWindow=id;
  activeApp=windows[id].app||'Finder';
  document.getElementById('activeAppName').textContent=activeApp;
  updateDockDots();
}
function closeWindow(id){if(!windows[id])return;var w=windows[id].el;w.classList.add('closing');setTimeout(function(){w.remove();delete windows[id];updateDockDots()},200)}
function minimizeWindow(id){if(!windows[id])return;var w=windows[id].el;w.classList.add('minimizing');setTimeout(function(){w.style.display='none';w.classList.remove('minimizing')},300);updateDockDots()}
function toggleMaximize(id){if(!windows[id])return;var w=windows[id].el;if(w.classList.contains('maximized'))w.classList.remove('maximized');else w.classList.add('maximized')}
function updateDockDots(){
  var running={};for(var id in windows){if(windows[id].el.style.display!=='none')running[windows[id].app]=true}
  document.querySelectorAll('.dock-item').forEach(function(i){var a=i.getAttribute('data-app');if(running[a])i.classList.add('running');else i.classList.remove('running')});
}

function makeDraggable(win,handle){
  var dragging=false,sx,sy,sl,st;
  handle.addEventListener('mousedown',function(e){if(e.target.classList.contains('tlight'))return;dragging=true;sx=e.clientX;sy=e.clientY;sl=parseInt(win.style.left);st=parseInt(win.style.top);e.preventDefault()});
  document.addEventListener('mousemove',function(e){if(!dragging)return;win.style.left=(sl+e.clientX-sx)+'px';win.style.top=Math.max(28,st+e.clientY-sy)+'px'});
  document.addEventListener('mouseup',function(){dragging=false});
}
function makeResizable(win,handle){
  var resizing=false,sx,sy,sw,sh;
  handle.addEventListener('mousedown',function(e){resizing=true;sx=e.clientX;sy=e.clientY;sw=win.offsetWidth;sh=win.offsetHeight;e.preventDefault();e.stopPropagation()});
  document.addEventListener('mousemove',function(e){if(!resizing)return;win.style.width=Math.max(300,sw+e.clientX-sx)+'px';win.style.height=Math.max(200,sh+e.clientY-sy)+'px'});
  document.addEventListener('mouseup',function(){resizing=false});
}

// App definitions
var apps={
  finder:{name:'Finder',title:'Finder',width:700,height:450,content:function(){
    return '<div class="finder"><div class="finder-sidebar"><div class="section">Favorites</div><div class="item active"><span>📁</span> Desktop</div><div class="item"><span>📄</span> Documents</div><div class="item"><span>⬇️</span> Downloads</div><div class="item"><span>🖼️</span> Pictures</div><div class="item"><span>🎵</span> Music</div><div class="section">iCloud</div><div class="item"><span>☁️</span> iCloud Drive</div><div class="section">Locations</div><div class="item"><span>💻</span> Mac</div><div class="item"><span>🌐</span> Network</div></div><div class="finder-main"><h3>Desktop</h3><div class="finder-grid"><div class="finder-file"><div class="icon">📁</div><div class="name">Projects</div></div><div class="finder-file"><div class="icon">📄</div><div class="name">Resume.pdf</div></div><div class="finder-file"><div class="icon">🖼️</div><div class="name">screenshot.png</div></div><div class="finder-file"><div class="icon">🎵</div><div class="name">playlist.m3u</div></div><div class="finder-file"><div class="icon">📦</div><div class="name">archive.zip</div></div><div class="finder-file"><div class="icon">📊</div><div class="name">budget.xlsx</div></div><div class="finder-file"><div class="icon">📝</div><div class="name">todo.txt</div></div><div class="finder-file"><div class="icon">🎨</div><div class="name">design.psd</div></div></div></div></div>';
  }},
  safari:{name:'Safari',title:'Safari',width:800,height:550,content:function(){
    var favs=[{n:'Apple',i:'🍎',b:'#333'},{n:'Google',i:'G',b:'#4285f4'},{n:'YouTube',i:'▶',b:'#ff0000'},{n:'Wikipedia',i:'W',b:'#000'},{n:'GitHub',i:'⌥',b:'#24292e'},{n:'Reddit',i:'R',b:'#ff4500'},{n:'News',i:'📰',b:'#007aff'},{n:'Maps',i:'🗺',b:'#4a90d9'}];
    var f=favs.map(function(x){return '<div class="safari-fav"><div class="icon" style="background:'+x.b+'">'+x.i+'</div><div class="name">'+x.n+'</div></div>'}).join('');
    return '<div class="safari"><div class="safari-toolbar"><button class="safari-btn">←</button><button class="safari-btn">→</button><input class="safari-url" placeholder="Search or enter website name"><button class="safari-btn">⟳</button></div><div class="safari-content"><div class="safari-start"><h1>Start Page</h1><p>Favorites</p><div class="safari-favorites">'+f+'</div></div></div></div>';
  }},
  calculator:{name:'Calculator',title:'Calculator',width:260,height:400,content:function(){
    return '<div class="calc"><div class="calc-display"><div class="preview" id="calcPrev"></div><div class="value" id="calcVal">0</div></div><div class="calc-buttons"><button class="calc-btn fn" data-k="C">C</button><button class="calc-btn fn" data-k="±">±</button><button class="calc-btn fn" data-k="%">%</button><button class="calc-btn op" data-k="÷">÷</button><button class="calc-btn" data-k="7">7</button><button class="calc-btn" data-k="8">8</button><button class="calc-btn" data-k="9">9</button><button class="calc-btn op" data-k="×">×</button><button class="calc-btn" data-k="4">4</button><button class="calc-btn" data-k="5">5</button><button class="calc-btn" data-k="6">6</button><button class="calc-btn op" data-k="−">−</button><button class="calc-btn" data-k="1">1</button><button class="calc-btn" data-k="2">2</button><button class="calc-btn" data-k="3">3</button><button class="calc-btn op" data-k="+">+</button><button class="calc-btn zero" data-k="0">0</button><button class="calc-btn" data-k=".">.</button><button class="calc-btn op" data-k="=">=</button></div></div>';
  },init:function(c){
    var disp=c.querySelector('#calcVal'),prev=c.querySelector('#calcPrev'),cur='0',stored=null,op=null,wait=false;
    function upd(){disp.textContent=cur;if(stored&&op)prev.textContent=stored+' '+op;else prev.textContent=''}
    c.querySelectorAll('.calc-btn').forEach(function(b){b.addEventListener('click',function(){
      var k=this.getAttribute('data-k');
      if(k>='0'&&k<='9'){if(wait){cur=k;wait=false}else cur=cur==='0'?k:cur+k;upd()}
      else if(k==='.'){if(wait){cur='0.';wait=false}else if(cur.indexOf('.')===-1)cur+='.';upd()}
      else if(k==='C'){cur='0';stored=null;op=null;wait=false;upd()}
      else if(k==='±'){cur=String(parseFloat(cur)*-1);upd()}
      else if(k==='%'){cur=String(parseFloat(cur)/100);upd()}
      else if(['+','−','×','÷'].indexOf(k)!==-1){if(stored&&!wait)calc();stored=cur;op=k;wait=true;upd()}
      else if(k==='='){if(stored)calc()}
    })});
    function calc(){var a=parseFloat(stored),b=parseFloat(cur),r;switch(op){case'+':r=a+b;break;case'−':r=a-b;break;case'×':r=a*b;break;case'÷':r=b===0?'Error':a/b;break;default:r=b}cur=String(r);stored=null;op=null;wait=true;upd()}
  }},
  textedit:{name:'TextEdit',title:'Untitled — TextEdit',width:600,height:450,content:function(){
    return '<div class="textedit"><div class="textedit-toolbar"><span style="font-weight:600">T</span><select style="font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid #ccc"><option>System</option><option>Helvetica</option><option>Times</option><option>Courier</option></select><select style="font-size:12px;padding:2px 6px;border-radius:4px;border:1px solid #ccc"><option>14</option><option>12</option><option>16</option><option>18</option><option>24</option></select><button style="font-weight:bold;border:none;background:transparent;cursor:pointer;padding:2px 6px;border-radius:4px">B</button><button style="font-style:italic;border:none;background:transparent;cursor:pointer;padding:2px 6px;border-radius:4px">I</button><button style="text-decoration:underline;border:none;background:transparent;cursor:pointer;padding:2px 6px;border-radius:4px">U</button></div><textarea placeholder="Start typing..."></textarea></div>';

  terminal:{name:'Terminal',title:'Terminal — bash',width:650,height:400,dark:true,content:function(){
    return '<div class="terminal"><div class="line output">Last login: '+new Date().toString()+' on ttys000</div><div class="line output">Welcome to macOS Web Terminal</div><div class="line output">Type "help" for available commands.</div><div id="termLines"></div><div class="terminal-input-line"><span class="prompt">admin@Mac</span> <span class="path">~</span> $ <input class="terminal-input" id="termInput" autocomplete="off"></div></div>';
  },init:function(c){
    var inp=c.querySelector('#termInput'),lines=c.querySelector('#termLines');
    function addLine(h){var d=document.createElement('div');d.className='line';d.innerHTML=h;lines.appendChild(d);c.scrollTop=c.scrollHeight}
    function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
    function run(cmd){
      addLine('<span class="prompt">admin@Mac</span> <span class="path">~</span> $ <span class="cmd-text">'+esc(cmd)+'</span>');
      var p=cmd.trim().split(/\s+/),co=p[0],out='';
      switch(co){
        case'help':out='Available commands:\n  help      Show this help\n  ls        List files\n  pwd       Print working directory\n  date      Show current date\n  whoami    Show current user\n  echo      Print text\n  clear     Clear terminal\n  neofetch  System info\n  open      Open an app (open safari)\n  about     About this system';break;
        case'ls':out='Desktop    Documents   Downloads\nMusic      Pictures    Movies\nPublic     Applications';break;
        case'pwd':out='/Users/admin';break;
        case'date':out=new Date().toString();break;
        case'whoami':out='admin';break;
        case'echo':out=p.slice(1).join(' ');break;
        case'clear':lines.innerHTML='';return;
        case'neofetch':out='OS: macOS Web 14.0\nHost: MacBook Pro (Web)\nKernel: 23.0.0\nShell: bash 5.2\nCPU: Apple M3 Pro (web)\nMemory: 16384MiB\nUptime: '+Math.floor(performance.now()/1000)+'s';break;
        case'about':out='macOS Web — A complete macOS desktop experience in the browser.\nBuilt with HTML, CSS, and JavaScript.';break;

        case'':break;
        default:out='bash: '+co+': command not found';
      }
      if(out)out.split('\n').forEach(function(l){addLine('<span class="output">'+esc(l)+'</span>')});
    }
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){run(inp.value);inp.value=''}});

    setTimeout(function(){inp.focus()},100);

function openApp(key){
  var app=apps[key];if(!app)return;
  var w=createWindow({app:app.name,title:app.title,width:app.width,height:app.height,dark:app.dark,content:app.content()});
  if(app.init)app.init(w.content);
  updateDockDots();
}

var currentDropdown=null;
function showDropdown(key,anchor){
  hideDropdown();var items=menus[key];if(!items)return;
  var dd=document.createElement('div');dd.className='dropdown show';
  items.forEach(function(it){if(it.divider){var d=document.createElement('div');d.className='dropdown-divider';dd.appendChild(d)}else{var el=document.createElement('div');el.className='dropdown-item';var h='<span>'+it.label+'</span>';if(it.shortcut)h+='<span class="shortcut">'+it.shortcut+'</span>';el.innerHTML=h;if(it.action)el.addEventListener('click',function(){it.action();hideDropdown()});dd.appendChild(el)}});
  anchor.appendChild(dd);currentDropdown=dd;anchor.classList.add('active');
}
function hideDropdown(){if(currentDropdown){currentDropdown.remove();currentDropdown=null}document.querySelectorAll('.menubar-item.active').forEach(function(e){e.classList.remove('active')})}
document.querySelectorAll('.menubar-item').forEach(function(i){i.addEventListener('click',function(e){e.stopPropagation();var k=i.getAttribute('data-menu');if(!k)return;if(currentDropdown&&currentDropdown.parentElement===i){hideDropdown();return}hideDropdown();showDropdown(k,i)})});

// Spotlight
var spotlight=document.getElementById('spotlight'),spotlightBackdrop=document.getElementById('spotlight-backdrop'),spotlightInput=document.getElementById('spotlightInput'),spotlightResults=document.getElementById('spotlightResults');
function openSpotlight(){spotlight.classList.add('show');spotlightBackdrop.style.display='block';spotlightInput.value='';spotlightResults.innerHTML='';spotlightInput.focus()}
function closeSpotlight(){spotlight.classList.remove('show');spotlightBackdrop.style.display='none'}
spotlightInput.addEventListener('input',function(){
  var q=spotlightInput.value.toLowerCase();if(!q){spotlightResults.innerHTML='';return}
  var m=[];for(var key in apps){if(apps[key].name.toLowerCase().indexOf(q)!==-1)m.push({key:key,name:apps[key].name})}
  spotlightResults.innerHTML=m.map(function(x){return '<div class="spotlight-result" data-app="'+x.key+'"><span class="icon">📦</span> '+x.name+'</div>'}).join('');
  spotlightResults.querySelectorAll('.spotlight-result').forEach(function(r){r.addEventListener('click',function(){openApp(r.getAttribute('data-app'));closeSpotlight()})});
});
spotlightInput.addEventListener('keydown',function(e){if(e.key==='Escape')closeSpotlight();if(e.key==='Enter'){var f=spotlightResults.querySelector('.spotlight-result');if(f){openApp(f.getAttribute('data-app'));closeSpotlight()}}});
spotlightBackdrop.addEventListener('click',closeSpotlight);
document.getElementById('searchItem').addEventListener('click',function(e){e.stopPropagation();openSpotlight()});
document.getElementById('controlItem').addEventListener('click',function(e){e.stopPropagation();showNotification('Control Center','Brightness: 100% • Wi-Fi: On • Bluetooth: On • Do Not Disturb: Off')});
document.getElementById('wifiItem').addEventListener('click',function(e){e.stopPropagation();showNotification('Wi-Fi','Connected to "MyNetwork" — IP: 192.168.1.100')});
document.getElementById('batteryItem').addEventListener('click',function(e){e.stopPropagation();showNotification('Battery','100% — Plugged in • Time remaining: unlimited')});

// Keyboard shortcuts
document.addEventListener('keydown',function(e){
  if(e.metaKey&&e.code==='Space'){e.preventDefault();if(spotlight.classList.contains('show'))closeSpotlight();else openSpotlight()}
  if(e.key==='Escape'){closeSpotlight();hideDropdown()}
  if(e.metaKey&&e.key==='w'&&activeWindow){e.preventDefault();closeWindow(activeWindow)}
  if(e.metaKey&&e.key==='m'&&activeWindow){e.preventDefault();minimizeWindow(activeWindow)}
});

// Context menu
document.getElementById('desktop').addEventListener('contextmenu',function(e){
  if(e.target.closest('.window')||e.target.closest('#dock')||e.target.closest('#menubar'))return;
  e.preventDefault();
  showContextMenu(e.clientX,e.clientY,[{label:'New Folder',action:function(){showNotification('Finder','New Folder created (simulated)')}},{label:'Get Info'},{divider:true},{label:'Change Desktop Background…',action:function(){showNotification('Desktop','Wallpaper change is not available in this web version.')}},{label:'Use Stacks'},{divider:true},{label:'Show View Options'}]);
});
function showContextMenu(x,y,items){
  closeContextMenu();var m=document.createElement('div');m.className='context-menu';m.id='contextMenu';
  items.forEach(function(it){if(it.divider){var d=document.createElement('div');d.className='cm-divider';m.appendChild(d)}else{var el=document.createElement('div');el.className='cm-item';el.textContent=it.label;if(it.action)el.addEventListener('click',function(){it.action();closeContextMenu()});m.appendChild(el)}});
  m.style.left=x+'px';m.style.top=y+'px';document.body.appendChild(m);
}
function closeContextMenu(){var e=document.getElementById('contextMenu');if(e)e.remove()}

// Auto-open Finder after unlock
var openedFinder=false;
function tryOpenFinder(){
  if(openedFinder)return;
  var ls=document.getElementById('lock-screen');
  if(ls.classList.contains('hidden')||ls.style.display==='none'){openApp('finder');openedFinder=true}
}
setTimeout(function(){var iv=setInterval(function(){if(!openedFinder)tryOpenFinder();else clearInterval(iv)},500)},4000);

})();
